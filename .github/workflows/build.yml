name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Nucleus requires JDK 17+ and Gradle 9.x (the wrapper pins 9.4.0).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Tests run headless. The engine tests use fakes, so no desktop, network or display is needed.
      - name: Test
        shell: bash
        run: ./gradlew --no-daemon :composeApp:desktopTest

      # An app image (a folder with a launcher) needs no extra tooling, so it is the reliable artifact.
      - name: Build app image
        shell: bash
        run: ./gradlew --no-daemon :composeApp:createDistributable

      # Installers (.deb / .dmg / .msi). Installers need extra tooling (electron-builder, signing), so a failure here must not hide the above.
      - name: Build installer
        continue-on-error: true
        shell: bash
        run: ./gradlew --no-daemon :composeApp:packageDistributionForCurrentOS

      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: wallpix-app-image-${{ matrix.os }}
          path: composeApp/build/compose/binaries/main/app/**
          if-no-files-found: warn

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: wallpix-installer-${{ matrix.os }}
          path: |
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/appimage/*.AppImage
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/nsis/*.exe
          if-no-files-found: ignore
